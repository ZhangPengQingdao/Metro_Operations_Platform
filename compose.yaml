services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: metro_operations_platform
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro_operations_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database:
