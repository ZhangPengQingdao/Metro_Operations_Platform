name: Build signed Linux release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/check.yml
  release:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require signing key
        env:
          SIGNING_KEY: ${{ secrets.MOP_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
      - name: Build pinned images
        run: |
          VERSION=$(node -p "require('./package.json').version")
          docker build --target api -f deploy/Dockerfile -t "mop-api:$VERSION" .
          docker build --target web -f deploy/Dockerfile -t "mop-web:$VERSION" .
          docker pull "$(python3 -c 'import json; print(json.load(open("deploy/images.json"))["postgres"])')"
          python3 deploy/release.py "$VERSION" release-assets "$RUNNER_TEMP/release-key.pem"
          openssl pkey -in "$RUNNER_TEMP/release-key.pem" -pubout -out release-assets/release-public.pem
          cmp deploy/release-public.pub release-assets/release-public.pem
          tar --exclude='__pycache__' -czf release-assets/installer.tar.gz package.json deploy/install.sh deploy/updater.py deploy/release-public.pub docs/linux-installation.md docs/server-first-install.md
      - name: Build standalone developer packages
        run: |
          npm ci
          npm run version:check
          npm run build:sdk
          npm run build:cli
          npm pack --workspace @metro/platform-sdk --ignore-scripts --pack-destination release-assets
          npm pack --workspace @metro/platform-cli --ignore-scripts --pack-destination release-assets
      - name: Publish draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" release-assets/* --draft --target "$GITHUB_SHA" --title "运管开放平台 $VERSION" --notes-file CHANGELOG.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-key.pem"
