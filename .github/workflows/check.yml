name: Platform checks
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm run build:sdk
      - run: npm --prefix server ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm --prefix server run build
      - run: npm test
      - run: npm --prefix applications/shifts test
      - run: npm --prefix applications/shifts run build
      - run: npm --prefix applications/faults test
      - run: npm --prefix applications/faults run build
      - run: npm --prefix server run app-cli -- validate ../applications/faults/dist
      - run: python3 -m unittest discover -s tests/deployment -v
      - run: bash -n deploy/install.sh

  linux-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -f deploy/Dockerfile -t mop-api:test .
      - run: docker build --target web -f deploy/Dockerfile -t mop-web:test .
      - run: sudo python3 tests/deployment/docker_smoke.py
